set -sg default-terminal "tmux-256color"
# sync — синхронизированный вывод (DEC 2026): tmux перерисовывает кадр атомарно,
# иначе на каждой перерисовке курсор прячется/показывается и заметно «моргает».
set -as terminal-features ",xterm-256color:RGB:sync"
set -g mouse on
set-option -g status-position bottom
set -g set-clipboard on
set -sg escape-time 0
# Пропуск ESC-последовательностей мимо tmux — нужен для kitty graphics protocol
# (Ghostty его умеет): картинки из euporie/imgcat рисует сам терминал.
# Без этого остаётся только sixel, который tmux 3.7 рендерит сам, но грубее.
set -g allow-passthrough on
# Ширина символов с VS16 (⚠️ = U+26A0 U+FE0F и подобные) — три звена должны
# считать одинаково, иначе строки перекашивает и таблицы разъезжаются:
#   Alacritty (TERM=xterm-256color) рисует их в 1 клетку → нужно off;
#   WezTerm с unicode_version = 14 (TERM=wezterm) — в 2 клетки → нужно on.
# Claude Code (string-width) всегда считает 2, поэтому под Alacritty таблицы
# с ⚠️ едут на колонку — лечится запретом VS16 в ~/.claude/rules/no-vs16-emoji.md,
# а под WezTerm сходится честно.
# Опция серверная (одна на всех клиентов), поэтому переключаем на attach.
# Значение по умолчанию — под Alacritty, он пока основной.
set -s variation-selector-always-wide off
set-hook -g client-attached 'if -F "#{==:#{client_termname},wezterm}" "set -s variation-selector-always-wide on ; refresh-client" "set -s variation-selector-always-wide off ; refresh-client"'

unbind C-b
bind C-f send-prefix
set -g prefix C-f
unbind r

bind r source-file ~/.config/tmux/tmux.conf

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Имя окна = базовое имя директории активной панели (показывается во вкладках как #W).
# Суффикс N (N — число сплитов в окне) — в окне есть сплиты с ДРУГИМИ
# каталогами; имя вкладки не раздуваем. Сплиты в том же каталоге суффикс не
# зажигают.  — Nerd Font nf-fa-columns U+F0DB, тот же FA-диапазон, что и
# клавиатура U+F11C в status-left; эмодзи 🪟 рендерился бы квадратом (ср.
# комментарий про ⌨️ у status-left).
# Механика: #{P:…#,} склеивает имена каталогов всех панелей через запятую (#, —
# экранированная запятая: голая означала бы «отдельный формат для активной
# панели»), затем s|…| вычитает все вхождения «активная,»; осталось непустое —
# есть чужой каталог. Имя-регексп с спецсимволами (например «c++») может дать
# ложный суффикс: s-паттерн — регулярка, не экранируется. Мелочь, живём.
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}#{?#{!=:#{s|#{b:pane_current_path},||:#{P:#{b:pane_current_path}#,}},}, #{window_panes},}'

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Переключение окон без префикса: Alt+цифра (раскладко-независимо —
# цифры одинаковы в QWERTY и ЙЦУКЕН, дубли не нужны)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# sesh: fzf-переключалка сессий (tmux-сессии + zoxide-директории)
bind T run-shell "sesh connect \"$(sesh list --icons | fzf-tmux -p 80%,70% --no-sort --ansi --prompt '⚡ ')\""

# Плагин переименовывал окна в иконку+программу — отключён, чтобы во вкладках была директория
# set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
# Не выходить из copy-mode после выделения мышью (не прыгать вниз)
set -g @yank_action 'copy-pipe'
# Тема — не плагин, а блок «Цвета: палитра Ubuntu» ниже: от dracula/tmux
# использовался только фон статус-бара, вкладки и плашки всё равно нарисованы
# вручную. Без плагина не нужно и перебивать его цвета после tpm.

# Сохранение/восстановление сессий (переживает перезапуск WSL).
# continuum должен грузиться ПОСЛЕ темы. Ручной сейв: prefix C-s,
# восстановление: prefix C-r (или само при @continuum-restore on).
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
# Восстановление сессий Claude Code вместе с tmux. Матчер «claude» (без ~) —
# точный по первому слову команды, поэтому nvim/less с путями вида ~/.claude/…
# не зацепит. Сохраняемую команду подменяет своя стратегия (см.
# resurrect-save-claude.sh): для claude-панелей пишет «claude --resume <id>»
# (id диалога конкретной панели из @cc_session) либо «claude --continue».
# Значение опции — имя файла, которое resurrect подставляет в путь
# plugins/tmux-resurrect/save_command_strategies/<имя>.sh, поэтому наверх к
# ~/.config/tmux/ выбираемся через ../../../ — иначе скрипт пришлось бы класть
# внутрь плагина, где его снёс бы апдейт tpm.
set -g @resurrect-processes 'claude'
set -g @resurrect-save-command-strategy '../../../resurrect-save-claude'

# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
# copy.sh сам выбирает pbcopy/wl-copy/xclip — голый wl-copy на маке молчал.
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "~/.config/tmux/copy.sh"

bind "'" split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind x kill-pane

# ── Дубли биндов для русской раскладки (та же клавиша в ЙЦУКЕН) ──
# Свои бинды
bind к source-file ~/.config/tmux/tmux.conf                # r
bind р select-pane -L                                      # h
bind о select-pane -D                                      # j
bind л select-pane -U                                      # k
bind д select-pane -R                                      # l
bind э split-window -v -c "#{pane_current_path}"           # '
bind с new-window -c "#{pane_current_path}"                # c
bind м split-window -h -c "#{pane_current_path}"           # v
bind ч kill-pane                                           # x
bind Е run-shell "sesh connect \"$(sesh list --icons | fzf-tmux -p 80%,70% --no-sort --ansi --prompt '⚡ ')\"" # T
# Дефолтные команды tmux
bind в detach-client                                       # d
bind я resize-pane -Z                                      # z
bind т next-window                                         # n
bind з previous-window                                     # p
bind ц choose-tree -Zw                                     # w
bind ы choose-tree -Zs                                     # s
bind х copy-mode                                           # [
bind ъ paste-buffer -p                                     # ]
bind б command-prompt -I "#W" "rename-window -- '%%'"      # ,
bind й display-panes                                       # q
# Copy-mode (vi)
bind-key -T copy-mode-vi м send-keys -X begin-selection               # v
bind-key -T copy-mode-vi н send-keys -X copy-pipe-and-cancel "~/.config/tmux/copy.sh" # y
bind-key -T copy-mode-vi р send-keys -X cursor-left                   # h
bind-key -T copy-mode-vi о send-keys -X cursor-down                   # j
bind-key -T copy-mode-vi л send-keys -X cursor-up                     # k
bind-key -T copy-mode-vi д send-keys -X cursor-right                  # l
bind-key -T copy-mode-vi й send-keys -X cancel                        # q
# bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
# bind-key -r j run-shell "tmux neww ~/.local/bin/tmux-sessionizer -s 0"
# bind-key -r k run-shell "tmux neww ~/.local/bin/tmux-sessionizer -s 1"
# bind-key -r h run-shell "tmux switch-client -p"
# bind-key -r l run-shell "tmux switch-client -n"

run '~/.config/tmux/plugins/tpm/tpm'

# ── Цвета: активная тема ─────────────────────────────────────────
# Симлинк на ~/.config/theme/themes/<имя>/tmux.conf — его переставляет команда
# `theme ubuntu|dracula` (она же перекрашивает alacritty, nvim и fzf) и сразу
# делает source-file этого конфига, так что цвета меняются без перезапуска.
# Тема задаёт только опции @th_* — форматы ниже ссылаются на них как
# #{@th_...}: tmux разворачивает опцию внутри #[fg=…] при отрисовке.
# Статус-бар прозрачный (bg=default) — сквозь него виден фон терминала,
# плашки вкладок рисуются вручную ниже.
source-file ~/.config/theme/active/tmux.conf
set -g status on
set -g status-interval 5
set -g status-style "bg=default,fg=#{@th_fg}"
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 120
set -g message-style "bg=#{@th_active},fg=#ffffff"
set -g message-command-style "bg=#{@th_active},fg=#ffffff"
set -g mode-style "bg=#{@th_active},fg=#ffffff"
# Правая часть статуса визуально пустая, но триггер автосейва continuum обязан
# жить в status-right — голый "" убивал бы периодическое сохранение.
set -g status-right "#(~/.config/tmux/plugins/tmux-continuum/scripts/continuum_save.sh)"

# Левая плашка «#h | #S» (наследие темы-плагина) убрана: машина одна, сессия
# всегда default — информации ноль. Вместо неё индикатор префикса: плашка как у
# вкладок со значком клавиатуры (Nerd Font U+F11C) по центру; при нажатом
# префиксе плашка желтеет. Эмодзи ⌨️ не годится: рендерится квадратами.
set -g status-left "#{?client_prefix,#[fg=#{@th_bg}]#[bg=#{@th_wait}],#[fg=#{@th_fg}]#[bg=#{@th_inactive}]}  #[fg=default]#[bg=default]"

# Границы панелей: неактивные — серый Tango, активная — светлый пурпур.
set -g pane-border-style "fg=#{@th_border}"
set -g pane-active-border-style "fg=#{@th_border_active}"

# ── Подпись сплита: тема сессии Claude Code ──────────────────────
# Claude Code сам шлёт краткое описание текущей задачи в заголовок терминала
# (OSC 2) — tmux кладёт его в #{pane_title}: «✳ Тема» когда ждёт промпт,
# «◐ Тема» пока идёт ход. Язык заголовка плавает (его пишет служебный запрос,
# "language": "Russian" на него не влияет), поэтому текст берём из @cc_task —
# первый промпт сессии, его ставит хук ~/.claude/hooks/pane-task.sh. От
# настоящего pane_title оставляем первый символ: это живой индикатор ✳/◐.
# Пока хук не отработал (@cc_task пуст) показываем pane_title как есть.
# Не-агентские панели (zsh title не ставит, там висел бы протухший заголовок
# от прошлого claude) показывают команду и каталог.
# Как узнаём агентскую панель: имя процесса содержит «claude» ЛИБО выглядит как
# версия (2.1.251). Второе — про нативный бинарь на macOS: он лежит в
# ~/.local/share/claude/versions/<версия> и имя процесса берёт от файла, слова
# «claude» в нём нет, и без этой ветки сплиты подписывались «2.1.251 truestats».
# Обрезка динамическая: pane_width минус 12 колонок под индекс, отступы и
# мышиные кнопки [z][x] справа; «…» — маркер обрезки.
set -g pane-border-format "#{?pane_active,#[bold],} #{pane_index} #{?#{||:#{m:*claude*,#{pane_current_command}},#{m:[0-9]*.[0-9]*,#{pane_current_command}}},#{=/#{e|-:#{pane_width},12}/…:#{?@cc_task,#{=1:#{pane_title}} #{@cc_task},#{pane_title}}},#{pane_current_command} #{b:pane_current_path}} #{?#{mouse},#[align=right]#[range=control|8][#{?#{window_zoomed_flag},u,z}]#[norange]#[range=control|9][x]#[norange],}"
# bottom — подпись в НИЖНЕЙ границе панели (top перенесёт её наверх).
# Включена всегда, в том числе для окна с единственной панелью: стоит одной
# строки высоты, зато тема сессии видна в любом окне, а не только в сплитах.
set -g pane-border-status bottom

# ── Подсветка окна по состоянию агентских CLI ────────────────────
# Флаг @claude_alert ставят хуки Claude (~/.claude/hooks/) через agent-alert.sh:
#   work → зелёный 🤖 (выполняет ход, watchdog-start.sh; ставится безусловно)
#   wait → жёлтый ❓ (ждёт ответа/разрешения, notify-input.sh)
#   done → оранжевый 🔔 (завершил работу, notify-stop.sh)
#   bg   → оранжевый 🔄 (ход завершён, фоновые задачи ещё бегут, notify-stop.sh)
#   hang → фиолетовый ⏳ (завис: тишина >5 мин, watchdog.sh)
#   error → красный ⚠️ (ход прерван ошибкой API, notify-error.sh)
#   compact → голубой 🗜️ (идёт сжатие контекста, notify-compact.sh:
#            PreCompact ставит, SessionStart source=compact снимает)
# work, bg и compact — длящиеся состояния (агент/фон/сжатие работают): ставятся
# безусловно и НЕ снимаются при переключении на окно — их снимают notify-хуки
# по концу хода/сжатия (финальный Stop без background_tasks → done;
# SessionStart source=compact → work либо done). Остальные —
# события: ставятся только когда окно не на виду, снимаются при переключении
# на окно.
# Плюс независимый бейдж @claude_shells (N ≥ 1) — « 🐚N» внутри плашки вкладки
# (в серой — голубой, в алертных — цветом текста): сколько фоновых shell-задач
# Claude бежит. Ставит agent-shells.sh:
# инкремент — shells-up.sh (PostToolUse Bash, run_in_background), авторитетный
# пересчёт — notify-stop.sh на каждом Stop (type=shell в background_tasks),
# чистка — SessionEnd. session-window-changed бейдж не трогает (длящееся
# состояние); рисуется и на активной вкладке (см. window-status-current-format).
set -g window-status-format "#{?@claude_alert,#{?#{==:#{@claude_alert},wait},#[fg=#{@th_wait}]#[bg=default]▐#[fg=#{@th_bg}]#[bg=#{@th_wait}] ❓ #I) #W#{?@claude_shells, 🐚#{@claude_shells},} #[bg=default],#{?#{==:#{@claude_alert},work},#[fg=#{@th_work}]#[bg=default]▐#[fg=#{@th_bg}]#[bg=#{@th_work}] 🤖 #I) #W#{?@claude_shells, 🐚#{@claude_shells},} #[bg=default],#{?#{==:#{@claude_alert},hang},#[fg=#{@th_hang}]#[bg=default]▐#[fg=#{@th_bg}]#[bg=#{@th_hang}] ⏳ #I) #W#{?@claude_shells, 🐚#{@claude_shells},} #[bg=default],#{?#{==:#{@claude_alert},error},#[fg=#{@th_error}]#[bg=default]▐#[fg=#{@th_bg}]#[bg=#{@th_error}] ⚠️ #I) #W#{?@claude_shells, 🐚#{@claude_shells},} #[bg=default],#{?#{==:#{@claude_alert},compact},#[fg=#{@th_compact}]#[bg=default]▐#[fg=#{@th_bg}]#[bg=#{@th_compact}] 🗜️ #I) #W#{?@claude_shells, 🐚#{@claude_shells},} #[bg=default],#{?#{==:#{@claude_alert},bg},#[fg=#{@th_done}]#[bg=default]▐#[fg=#{@th_bg}]#[bg=#{@th_done}] 🔄 #I) #W#{?@claude_shells, 🐚#{@claude_shells},} #[bg=default],#[fg=#{@th_done}]#[bg=default]▐#[fg=#{@th_bg}]#[bg=#{@th_done}] 🔔 #I) #W#{?@claude_shells, 🐚#{@claude_shells},} #[bg=default]}}}}}},#[fg=#{@th_inactive}]#[bg=default]▐#[fg=#{@th_fg}]#[bg=#{@th_inactive}] #I) #W#{?@claude_shells, #[fg=#{@th_shells}]🐚#{@claude_shells},} #[bg=default]}"
# Активная вкладка — прямоугольник без powerline-стрелок.
# Зазор между вкладками — полколонки: separator "", левый край каждой плашки —
# полублок ▐ (левая половина тёмная = зазор, правая — цвет плашки).
# Длящиеся состояния (work 🤖 / bg 🔄 / compact 🗜️) рисуем и на активной вкладке — агент
# продолжает работать и когда окно на виду. Другие значения тут невозможны:
# события (done/wait/hang/error) при активном окне agent-alert.sh не ставит,
# а оставшиеся с неактивных времён снимает хук session-window-changed.
set -g window-status-separator ""
set -g window-status-current-format "#[fg=#{@th_active}]#[bg=default]▐#[fg=#{@th_fg}]#[bg=#{@th_active}] #{?#{==:#{@claude_alert},work},🤖 ,}#{?#{==:#{@claude_alert},bg},🔄 ,}#{?#{==:#{@claude_alert},compact},🗜️ ,}#I) #W#{?@claude_shells, #[fg=#{@th_shells}]🐚#{@claude_shells},} #[bg=default]"
# Снятие метки при взгляде на окно: session-window-changed (а не after-select-window)
# ловит ЛЮБОЙ способ смены текущего окна (select/next/prev, колесо по статус-бару,
# choose-tree, switch-client). Заодно ставит @claude_seen «окно смотрели»: его
# читает notify-input.sh, чтобы idle_prompt через минуту простоя не перезажигал
# 🔔 на уже прочитанном ответе (баг 2026-07-15); снимает watchdog-start.sh на
# старте нового хода.
# -g (не -ga): хук больше никем не занят, replace идемпотентен при `prefix r`.
set-hook -g session-window-changed "if -F '#{&&:#{&&:#{!=:#{@claude_alert},work},#{!=:#{@claude_alert},bg}},#{!=:#{@claude_alert},compact}}' 'set -uw @claude_alert' ; set -w @claude_seen 1"
